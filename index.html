<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Star Personality Quiz</title>

    <meta name="description"
        content="ค้นพบราศีที่สะท้อนตัวตนของคุณ">

    <link rel="icon" href="images/logo.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/result.css">
    <link rel="stylesheet" href="css/animation.css">

</head>

<body>

    <!-- Background -->

    <div id="background"></div>

    <!-- ====================================================== -->
    <!-- Landing -->
    <!-- ====================================================== -->

    <section id="landingPage" class="page active">

        <div class="landing-container">

            <img
                src="images/logo.png"
                class="logo"
                alt="Logo">

            <h1 id="landingTitle">

                ดวงดาวดวงใด<br>
                สะท้อนตัวตนของคุณ

            </h1>

            <p id="landingDescription">

                ตอบคำถามเพียง 5 ข้อ

                <br><br>

                เพื่อค้นหาราศีที่มีแก่นของบุคลิก
                ใกล้เคียงกับคุณมากที่สุด

            </p>

            <button id="startButton">

                เริ่มแบบทดสอบ

            </button>

        </div>

    </section>



    <!-- ====================================================== -->
    <!-- Quiz -->
    <!-- ====================================================== -->

    <section id="quizPage" class="page">

        <div class="quiz-container">

            <!-- Progress -->

            <div class="progress-top">

                <span id="questionNumber">

                    ข้อ 1 / 5

                </span>

                <span id="progressPercent">

                    20%

                </span>

            </div>

            <div class="progress-bar">

                <div id="progressFill"></div>

            </div>


            <!-- Image -->

            <img
                id="questionImage"
                src=""
                alt="">


            <!-- Question -->

            <h2 id="questionTitle">

            </h2>


            <!-- Answers -->

            <div id="answerContainer">

            </div>


            <!-- Next -->

            <button
                id="nextButton"
                disabled>

                ถัดไป

            </button>

        </div>

    </section>



    <!-- ====================================================== -->
    <!-- Loading -->
    <!-- ====================================================== -->

    <section id="loadingPage" class="page">

        <div class="loading-container">

            <div class="loading-circle"></div>

            <h2>

                กำลังวิเคราะห์...

            </h2>

            <p>

                โปรดรอสักครู่

            </p>

        </div>

    </section>



    <!-- ====================================================== -->
    <!-- Result -->
    <!-- ====================================================== -->

    <section id="resultPage" class="page">

        <div class="result-container">

            <img
                id="resultImage"
                src=""
                alt="">


            <p id="resultSubtitle">

            </p>


            <h1 id="resultTitle">

            </h1>


            <p id="resultDescription">

            </p>


            <div class="result-buttons">

                <button id="shareButton">

                    แชร์ผลลัพธ์

                </button>

                <button id="restartButton">

                    ทำอีกครั้ง

                </button>

            </div>

        </div>

    </section>



    <!-- ====================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ====================================================== -->

    <script src="js/config.js"></script>

    <script src="js/app.js"></script>

    <script src="js/quiz.js"></script>

    <script src="js/result.js"></script>

    <script src="js/animation.js"></script>

    <script src="js/share.js"></script>

</body>

</html>
